[project]
name = "fatura-viewer"
version = "0.1.0"
description = "API + parsers de faturas de cartão de crédito em Python"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Jhonatan", email = "jhonatan@example.com" }
]
keywords = ["fatura", "cartao-de-credito", "pdf", "parser", "extractor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pdfplumber>=0.11.0",
    "pymupdf>=1.28.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fatura-viewer = "cli:main"

[project.urls]
repository = "https://github.com/jhonatan/fatura-viewer"
issues = "https://github.com/jhonatan/fatura-viewer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractors", "parsers", "tests"]
